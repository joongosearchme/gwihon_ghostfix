# GhostFix 자동 빌드
# - 어느 브랜치든 푸시하면 Windows 서버에서 빌드하고, Actions 탭의 실행 결과 아래 "Artifacts"에 GhostFix.exe를 올린다.
# - v1.0.1 같은 태그를 올리면 그 번호를 exe 버전으로 넣어 빌드하고 Releases에 올린다.
name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# 기본은 읽기만. 쓰기 권한은 필요한 작업(job)에만 준다.
permissions:
  contents: read

# 외부 액션은 태그 대신 커밋 번호로 고정한다(태그가 다른 코드로 바뀌어도 그대로 쓰지 않게). 뒤의 주석이 그 커밋의 태그.
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write       # 빌드 출처 증명(attestation)에 서명하는 데 필요
      attestations: write   # 빌드 출처 증명을 저장소에 보관하는 데 필요
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: 버전 정하기
        id: ver
        shell: bash
        # 태그 이름은 숫자와 점(v1.2.3)만 받는다. 다른 글자가 든 태그가 빌드 명령에 섞여 들어가지 않게 한다.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
            if [[ ! "$ver" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
              echo "::error::태그 이름은 v1.2.3 형식이어야 합니다: $GITHUB_REF_NAME"
              exit 1
            fi
            echo "version=$ver" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      # 값은 워크플로 표현식으로 명령 글에 바로 넣지 않고 환경 변수로 넘긴다.
      - name: 빌드
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          args=()
          if [[ -n "$VERSION" ]]; then
            args+=("-p:Version=$VERSION")
          fi
          dotnet build GhostFix.csproj -c Release -nologo -o dist "${args[@]}"

      # 받은 exe가 이 빌드 결과와 같은지 확인할 수 있게 SHA-256 해시를 만든다.
      # GhostFix.exe.sha256 파일로 같이 올리고, 실행 요약 화면과 Releases 설명에도 적는다.
      - name: 해시 만들기
        id: hash
        shell: bash
        run: |
          cd dist
          sha256sum GhostFix.exe > GhostFix.exe.sha256
          hash=$(cut -d' ' -f1 GhostFix.exe.sha256)
          echo "sha256=$hash" >> "$GITHUB_OUTPUT"
          echo "### GhostFix.exe SHA-256" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$hash" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # "이 exe는 이 저장소의 이 커밋에서 이 자동 빌드로 만들었다"는 증명을 GitHub이 서명해 보관한다.
      # 확인: gh attestation verify GhostFix.exe -R joongosearchme/gwihon_ghostfix
      # PR 빌드(남의 포크 포함)는 서명 권한이 없으므로 건너뛴다.
      - name: 빌드 출처 증명
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/GhostFix.exe

      - name: exe 올리기 (Actions 탭)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: GhostFix
          path: |
            dist/GhostFix.exe
            dist/GhostFix.exe.sha256
          if-no-files-found: error

  # Releases에 올리기(태그일 때만). 저장소 쓰기 권한은 이 작업에만 준다.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Releases에 올리는 데 필요
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: GhostFix
          path: dist

      - name: Releases에 올리기
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          notes=$(printf '**GhostFix.exe SHA-256**\n```\n%s\n```\nPowerShell에서 `Get-FileHash GhostFix.exe`로 나온 값과 같은지 확인하세요(대소문자 무관).\n' "$SHA256")
          gh release create "$GITHUB_REF_NAME" dist/GhostFix.exe dist/GhostFix.exe.sha256 \
            -R "$GITHUB_REPOSITORY" --title "GhostFix $GITHUB_REF_NAME" --notes "$notes" --generate-notes
