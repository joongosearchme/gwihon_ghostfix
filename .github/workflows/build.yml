# GhostFix 자동 빌드
# - 어느 브랜치든 푸시하면 Windows 서버에서 빌드하고, Actions 탭의 실행 결과 아래 "Artifacts"에 GhostFix.exe를 올린다.
# - v1.0.1 같은 태그를 올리면 그 번호를 exe 버전으로 넣어 빌드하고 Releases에 올린다.
name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # Releases에 올리는 데 필요

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 버전 정하기
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "args=-p:Version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - name: 빌드
        shell: bash
        run: dotnet build GhostFix.csproj -c Release -nologo -o dist ${{ steps.ver.outputs.args }}

      # 받은 exe가 이 빌드 결과와 같은지 확인할 수 있게 SHA-256 해시를 만든다.
      # GhostFix.exe.sha256 파일로 같이 올리고, 실행 요약 화면과 Releases 설명에도 적는다.
      - name: 해시 만들기
        id: hash
        shell: bash
        run: |
          cd dist
          sha256sum GhostFix.exe > GhostFix.exe.sha256
          hash=$(cut -d' ' -f1 GhostFix.exe.sha256)
          echo "sha256=$hash" >> "$GITHUB_OUTPUT"
          echo "### GhostFix.exe SHA-256" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$hash" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: exe 올리기 (Actions 탭)
        uses: actions/upload-artifact@v4
        with:
          name: GhostFix
          path: |
            dist/GhostFix.exe
            dist/GhostFix.exe.sha256
          if-no-files-found: error

      - name: Releases에 올리기 (태그일 때만)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ steps.hash.outputs.sha256 }}
        run: |
          notes=$(printf '**GhostFix.exe SHA-256**\n```\n%s\n```\nPowerShell에서 `Get-FileHash GhostFix.exe`로 나온 값과 같은지 확인하세요(대소문자 무관).\n' "$SHA256")
          gh release create "$GITHUB_REF_NAME" dist/GhostFix.exe dist/GhostFix.exe.sha256 \
            --title "GhostFix $GITHUB_REF_NAME" --notes "$notes" --generate-notes
